services:
  # ── PostgreSQL (主数据库) ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_smart_query
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis (缓存/会话) ──
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      # Host 6379 is often already taken by a native Redis install.
      # Container port stays 6379, so `redis://redis:6379` inside the network
      # is unaffected — only the host-side debug port moves.
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Qdrant (向量数据库) ──
  qdrant:
    image: qdrant/qdrant:v1.12.0
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrantdata:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"

  # ── Backend (FastAPI + LangGraph) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/rag_smart_query
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      # ── Chat model ──
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # ── Embedding (independent — DeepSeek has no embedding endpoint) ──
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-huggingface}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-false}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      # -- Local embedding model (EMBEDDING_PROVIDER=huggingface) --
      # Weights are NOT baked into the image; they are mounted from the host
      # cache below. Download once on the host before the first `up`:
      #   huggingface-cli download BAAI/bge-large-zh-v1.5
      HF_EMBEDDING_MODEL: ${HF_EMBEDDING_MODEL:-BAAI/bge-large-zh-v1.5}
      HF_EMBEDDING_DEVICE: ${HF_EMBEDDING_DEVICE:-cpu}
      HF_EMBEDDING_NORMALIZE: ${HF_EMBEDDING_NORMALIZE:-true}
      HF_EMBEDDING_QUERY_INSTRUCTION: ${HF_EMBEDDING_QUERY_INSTRUCTION:-为这个句子生成表示以用于检索相关文章：}
      HF_EMBEDDING_OFFLINE: ${HF_EMBEDDING_OFFLINE:-true}
      # Keep torch from grabbing every core and starving the API workers.
      HF_EMBEDDING_TORCH_THREADS: ${HF_EMBEDDING_TORCH_THREADS:-4}
      # The host cache is mounted read-only, so point only the *hub* cache at
      # it and give HF a writable scratch dir for locks/metadata.
      HF_HOME: /tmp/hf
      HF_HUB_CACHE: /models/hub
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-32bytes}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890}
      DEBUG: "true"
      # ── First-boot bootstrap (scripts/init_db.py, idempotent) ──
      INIT_TENANT_NAME: ${INIT_TENANT_NAME:-Default Tenant}
      INIT_TENANT_SLUG: ${INIT_TENANT_SLUG:-default}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-admin123456}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-admin@example.com}
    # No Alembic yet: create the schema and seed the admin before serving.
    command: >
      sh -c "python -m scripts.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      # Share the host's HuggingFace cache instead of re-downloading ~1.3GB
      # into the image. Read-only: the container must never mutate it.
      # Windows hosts: set HF_CACHE_DIR=C:/Users/<you>/.cache/huggingface
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/models:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  # ── Frontend (React + Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Nginx (反向代理 / SSL终止) ──
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  qdrantdata:
